name: Reusable YUP plugin signed release

on:
  workflow_call:
    inputs:
      product_name:
        description: Product and CMake project name
        required: true
        type: string
      tag_name:
        description: Existing semver tag to promote, for manual recovery callers
        required: false
        default: ''
        type: string
      publish_release:
        description: Publish a GitHub Release after signing; false runs a non-publishing macOS canary
        required: false
        default: true
        type: boolean
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        description: Base64-encoded Developer ID Application PKCS#12 archive
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        description: Password for the PKCS#12 archive
        required: true
      APPLE_TEAM_ID:
        description: Apple Developer Team ID used by the signing identity
        required: true
      APPLE_API_KEY_ID:
        description: App Store Connect Team API key ID
        required: true
      APPLE_API_ISSUER_ID:
        description: App Store Connect Team API issuer ID
        required: true
      APPLE_API_PRIVATE_KEY_P8_BASE64:
        description: Base64-encoded App Store Connect Team API private key
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  provenance:
    name: Resolve exact-SHA artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      mac_id: ${{ steps.artifacts.outputs.mac_id }}
      run_id: ${{ steps.provenance.outputs.run_id }}
      tag_name: ${{ steps.provenance.outputs.tag_name }}
      version: ${{ steps.provenance.outputs.version }}
      windows_id: ${{ steps.artifacts.outputs.windows_id }}
    steps:
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v gh
          command -v jq
          command -v unzip
          command -v sha256sum
          gh_version="$(gh --version | awk 'NR == 1 { print $3 }')"
          [[ "${gh_version%%.*}" -ge 2 ]]

      - name: Resolve tag and successful CI run
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          PRODUCT: ${{ inputs.product_name }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG_NAME#v}"

          target_type="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG_NAME" --jq '.object.type')"
          target_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG_NAME" --jq '.object.sha')"
          depth=0
          while [[ "$target_type" == tag ]]; do
            depth=$((depth + 1))
            [[ "$depth" -le 5 ]]
            tag_object="$(gh api "repos/$GH_REPO/git/tags/$target_sha")"
            target_type="$(jq -r '.object.type' <<< "$tag_object")"
            target_sha="$(jq -r '.object.sha' <<< "$tag_object")"
          done
          [[ "$target_type" == commit ]]

          cmake_source="$(gh api "repos/$GH_REPO/contents/CMakeLists.txt?ref=$target_sha" --jq '.content' | base64 --decode)"
          mapfile -t cmake_versions < <(
            sed -nE "/^[[:space:]]*#/d; s/^[[:space:]]*project[[:space:]]*\\([[:space:]]*${PRODUCT}[[:space:]]+VERSION[[:space:]]+([0-9]+\\.[0-9]+\\.[0-9]+)[[:space:])]+.*$/\\1/p" \
              <<< "$cmake_source"
          )
          [[ "${#cmake_versions[@]}" -gt 0 ]]
          for cmake_version in "${cmake_versions[@]}"; do
            [[ "$cmake_version" == "$version" ]]
          done

          runs="$(gh api --paginate \
            "repos/$GH_REPO/actions/runs?branch=main&event=push&head_sha=$target_sha&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_branch == "main" and .head_sha == "'"$target_sha"'" and .event == "push" and .status == "completed" and .conclusion == "success") | [.id, .head_sha] | @tsv')"
          [[ -n "$runs" ]]
          [[ "$(wc -l <<< "$runs" | tr -d ' ')" == 1 ]]
          IFS=$'\t' read -r run_id run_sha <<< "$runs"
          [[ "$run_sha" == "$target_sha" ]]

          {
            printf 'run_id=%s\n' "$run_id"
            printf 'tag_name=%s\n' "$TAG_NAME"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve exact artifact IDs
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.provenance.outputs.run_id }}
          PRODUCT: ${{ inputs.product_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          artifacts="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name, .expired] | @tsv')"
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            [[ "$(wc -l <<< "$artifacts" | tr -d ' ')" == 2 ]]
          fi
          mac_id="$(awk -F '\t' -v name="${PRODUCT}-latest-macos-arm64" '$2 == name && $3 == "false" { print $1 }' <<< "$artifacts")"
          windows_id="$(awk -F '\t' -v name="${PRODUCT}-latest-windows-x64" '$2 == name && $3 == "false" { print $1 }' <<< "$artifacts")"
          [[ "$mac_id" =~ ^[0-9]+$ ]]
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            [[ "$windows_id" =~ ^[0-9]+$ ]]
          fi
          printf 'mac_id=%s\nwindows_id=%s\n' "$mac_id" "$windows_id" >> "$GITHUB_OUTPUT"

  sign-macos:
    name: Sign and notarize macOS
    needs: provenance
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download exact macOS artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAC_ID: ${{ needs.provenance.outputs.mac_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/macos release-candidate
          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GH_REPO/actions/artifacts/$MAC_ID/zip" > artifacts/macos.zip
          unzip -q artifacts/macos.zip -d artifacts/macos

      - name: Verify unsigned artifact checksum
        shell: bash
        env:
          PRODUCT: ${{ inputs.product_name }}
        run: |
          set -euo pipefail
          expected_zip="${PRODUCT}-latest-macos-arm64.zip"
          manifest="artifacts/macos/SHA256SUMS.txt"
          [[ -f "artifacts/macos/$expected_zip" ]]
          [[ -f "$manifest" ]]
          [[ "$(wc -l < "$manifest" | tr -d ' ')" == 1 ]]
          line="$(cat "$manifest")"
          [[ "$line" =~ ^[0-9a-f]{64}\ \ [A-Za-z0-9._-]+$ ]]
          [[ "${line#*  }" == "$expected_zip" ]]
          expected_hash="${line%%  *}"
          [[ "$(shasum -a 256 "artifacts/macos/$expected_zip" | awk '{print $1}')" == "$expected_hash" ]]

      - name: Sign, notarize, staple, and reverify
        id: signing
        uses: EsionHsrahLatigid/ehl-macos-signing-action@6164c267c8ce723d91cee4b6150d513cfe99b708
        with:
          product-name: ${{ inputs.product_name }}
          input-zip: artifacts/macos/${{ inputs.product_name }}-latest-macos-arm64.zip
          output-zip: release-candidate/${{ inputs.product_name }}-${{ needs.provenance.outputs.version }}-macos-arm64.zip
          certificate-p12-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}
          apple-api-private-key-p8-base64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}

      - name: Record signed candidate checksum
        shell: bash
        env:
          PRODUCT: ${{ inputs.product_name }}
          VERSION: ${{ needs.provenance.outputs.version }}
          SIGNED_SHA256: ${{ steps.signing.outputs.sha256 }}
        run: |
          set -euo pipefail
          zip_name="${PRODUCT}-${VERSION}-macos-arm64.zip"
          [[ "$SIGNED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$SIGNED_SHA256" "$zip_name" > "release-candidate/${zip_name}.sha256"

      - name: Upload signed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-macos-release-candidate
          path: release-candidate/
          if-no-files-found: error
          retention-days: 1

  verify-signed-macos:
    name: Verify uploaded signed macOS candidate
    needs:
      - provenance
      - sign-macos
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download uploaded signed macOS candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-macos-release-candidate
          path: uploaded-signed-macos

      - name: Verify uploaded signed macOS candidate
        shell: bash
        env:
          PRODUCT: ${{ inputs.product_name }}
          VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail

          candidate_dir="uploaded-signed-macos"
          extract_dir="verified-signed-macos"
          expected_zip="${PRODUCT}-${VERSION}-macos-arm64.zip"
          expected_checksum="${expected_zip}.sha256"

          entries=()
          while IFS= read -r -d '' entry; do
            entries+=("$entry")
          done < <(find "$candidate_dir" -mindepth 1 -maxdepth 1 -print0)
          [[ "${#entries[@]}" == 2 ]]
          [[ -f "$candidate_dir/$expected_zip" ]]
          [[ -f "$candidate_dir/$expected_checksum" ]]

          line="$(cat "$candidate_dir/$expected_checksum")"
          [[ "$line" =~ ^[0-9a-f]{64}\ \ [A-Za-z0-9._-]+$ ]]
          [[ "${line#*  }" == "$expected_zip" ]]
          (cd "$candidate_dir" && shasum -a 256 -c "$expected_checksum")

          mkdir -p "$extract_dir"
          ditto -x -k "$candidate_dir/$expected_zip" "$extract_dir"

          apps=()
          vst3s=()
          components=()
          code_containers=()
          while IFS= read -r -d '' bundle; do
            code_containers+=("$bundle")
            case "$bundle" in
              *.app) apps+=("$bundle") ;;
              *.vst3) vst3s+=("$bundle") ;;
              *.component) components+=("$bundle") ;;
            esac
          done < <(
            find "$extract_dir" -type d \( \
              -name '*.app' -o \
              -name '*.vst3' -o \
              -name '*.component' -o \
              -name '*.framework' -o \
              -name '*.xpc' -o \
              -name '*.appex' -o \
              -name '*.plugin' \
            \) -print0
          )
          [[ "${#apps[@]}" == 1 ]]
          [[ "${#vst3s[@]}" == 1 ]]
          [[ "${#components[@]}" == 1 ]]
          [[ "${#code_containers[@]}" == 3 ]]

          verify_bundle() {
            local bundle="$1"
            local details team_id timestamp

            codesign --verify --deep --strict --verbose=4 "$bundle"
            details="$(codesign -dv --verbose=4 "$bundle" 2>&1)"
            grep -Eq '^Authority=Developer ID Application:' <<< "$details"

            team_id="$(awk -F= '$1 == "TeamIdentifier" { print $2; exit }' <<< "$details")"
            [[ -n "$team_id" ]]
            [[ "$team_id" != "not set" ]]

            grep -Eq '(^Runtime Version=|flags=.*runtime)' <<< "$details"
            timestamp="$(awk -F= '$1 == "Timestamp" { print $2; exit }' <<< "$details")"
            [[ -n "$timestamp" ]]
            [[ "$timestamp" != "none" ]]

            if codesign -d --entitlements :- "$bundle" 2>/dev/null \
              | plutil -extract com.apple.security.get-task-allow raw -o - - >/dev/null 2>&1; then
              echo "get-task-allow entitlement is present in $bundle" >&2
              exit 1
            fi

            xcrun stapler validate "$bundle"
          }

          verify_bundle "${apps[0]}"
          verify_bundle "${vst3s[0]}"
          verify_bundle "${components[0]}"
          spctl --assess --type execute --verbose=4 "${apps[0]}"

  prepare-windows:
    name: Prepare Windows candidate
    needs: provenance
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download and verify exact Windows artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRODUCT: ${{ inputs.product_name }}
          VERSION: ${{ needs.provenance.outputs.version }}
          WINDOWS_ID: ${{ needs.provenance.outputs.windows_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/windows release-candidate
          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GH_REPO/actions/artifacts/$WINDOWS_ID/zip" > artifacts/windows.zip
          unzip -q artifacts/windows.zip -d artifacts/windows
          expected_zip="${PRODUCT}-latest-windows-x64.zip"
          manifest="artifacts/windows/SHA256SUMS.txt"
          [[ -f "artifacts/windows/$expected_zip" ]]
          [[ -f "$manifest" ]]
          [[ "$(wc -l < "$manifest" | tr -d ' ')" == 1 ]]
          line="$(cat "$manifest")"
          [[ "$line" =~ ^[0-9a-f]{64}\ \ [A-Za-z0-9._-]+$ ]]
          [[ "${line#*  }" == "$expected_zip" ]]
          (cd artifacts/windows && sha256sum --check --strict SHA256SUMS.txt)
          versioned_zip="${PRODUCT}-${VERSION}-windows-x64.zip"
          cp "artifacts/windows/$expected_zip" "release-candidate/$versioned_zip"
          unzip -t "release-candidate/$versioned_zip"
          (cd release-candidate && sha256sum "$versioned_zip" > "${versioned_zip}.sha256")

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-candidate
          path: release-candidate/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified release
    needs:
      - provenance
      - verify-signed-macos
      - prepare-windows
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download signed macOS candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-macos-release-candidate
          path: release-candidates

      - name: Download Windows candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-release-candidate
          path: release-candidates

      - name: Verify release candidates
        shell: bash
        env:
          PRODUCT: ${{ inputs.product_name }}
          VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail
          mac_zip="${PRODUCT}-${VERSION}-macos-arm64.zip"
          windows_zip="${PRODUCT}-${VERSION}-windows-x64.zip"
          [[ "$(find release-candidates -maxdepth 1 -type f | wc -l | tr -d ' ')" == 4 ]]
          (cd release-candidates && sha256sum --check --strict "${mac_zip}.sha256")
          (cd release-candidates && sha256sum --check --strict "${windows_zip}.sha256")
          unzip -t "release-candidates/$mac_zip"
          unzip -t "release-candidates/$windows_zip"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.provenance.outputs.tag_name }}
          PRODUCT: ${{ inputs.product_name }}
          VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail
          mac_zip="${PRODUCT}-${VERSION}-macos-arm64.zip"
          windows_zip="${PRODUCT}-${VERSION}-windows-x64.zip"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"
            [[ "$is_draft" == true ]]
          else
            gh release create "$TAG_NAME" --verify-tag --draft \
              --title "$PRODUCT $VERSION" --generate-notes
          fi
          while IFS= read -r existing_asset; do
            [[ -z "$existing_asset" ]] || gh release delete-asset "$TAG_NAME" "$existing_asset" --yes
          done < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          gh release upload "$TAG_NAME" \
            "release-candidates/$mac_zip" \
            "release-candidates/$windows_zip" --clobber
          mapfile -t published_assets < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          [[ "${#published_assets[@]}" == 2 ]]
          [[ "${published_assets[0]}" == "$mac_zip" ]]
          [[ "${published_assets[1]}" == "$windows_zip" ]]
          gh release edit "$TAG_NAME" --draft=false
