name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-contract:
    name: Stage and local-copy contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test staging and exact bundle replacement
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          cmake \
            -DEHL_TEST_ROOT="$test_root" \
            -DEHL_STAGE_SCRIPT="$PWD/cmake/StageYupProducts.cmake" \
            -P tests/TestStageAndInstall.cmake
