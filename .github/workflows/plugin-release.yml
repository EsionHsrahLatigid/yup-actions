name: Reusable YUP plugin release

on:
  workflow_call:
    inputs:
      product_name:
        description: Product and CMake project name
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Promote exact-SHA artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v gh
          command -v jq
          command -v unzip
          command -v sha256sum
          gh_version="$(gh --version | awk 'NR == 1 { print $3 }')"
          [[ "${gh_version%%.*}" -ge 2 ]]

      - name: Resolve tag and successful CI run
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRODUCT: ${{ inputs.product_name }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${TAG_NAME#v}"

          target_type="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG_NAME" --jq '.object.type')"
          target_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG_NAME" --jq '.object.sha')"
          depth=0
          while [[ "$target_type" == tag ]]; do
            depth=$((depth + 1))
            [[ "$depth" -le 5 ]]
            tag_object="$(gh api "repos/$GH_REPO/git/tags/$target_sha")"
            target_type="$(jq -r '.object.type' <<< "$tag_object")"
            target_sha="$(jq -r '.object.sha' <<< "$tag_object")"
          done
          [[ "$target_type" == commit ]]

          cmake_source="$(gh api "repos/$GH_REPO/contents/CMakeLists.txt?ref=$target_sha" --jq '.content' | base64 --decode)"
          mapfile -t cmake_versions < <(
            sed -nE "/^[[:space:]]*#/d; s/^[[:space:]]*project[[:space:]]*\\([[:space:]]*${PRODUCT}[[:space:]]+VERSION[[:space:]]+([0-9]+\\.[0-9]+\\.[0-9]+)[[:space:])]+.*$/\\1/p" \
              <<< "$cmake_source"
          )
          [[ "${#cmake_versions[@]}" -gt 0 ]]
          for cmake_version in "${cmake_versions[@]}"; do
            [[ "$cmake_version" == "$version" ]]
          done

          runs="$(gh api --paginate \
            "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&status=success&event=push&head_sha=$target_sha&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "CI" and .path == ".github/workflows/ci.yml" and .head_branch == "main" and .head_sha == "'"$target_sha"'" and .event == "push" and .status == "completed" and .conclusion == "success") | [.id, .head_sha] | @tsv')"
          [[ -n "$runs" ]]
          [[ "$(wc -l <<< "$runs" | tr -d ' ')" == 1 ]]
          IFS=$'\t' read -r run_id run_sha <<< "$runs"
          [[ "$run_sha" == "$target_sha" ]]

          {
            printf 'tag_commit=%s\n' "$target_sha"
            printf 'run_id=%s\n' "$run_id"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve exact artifact IDs
        id: artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.provenance.outputs.run_id }}
          PRODUCT: ${{ inputs.product_name }}
        run: |
          set -euo pipefail
          artifacts="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name, .expired] | @tsv')"
          [[ "$(wc -l <<< "$artifacts" | tr -d ' ')" == 2 ]]
          mac_id="$(awk -F '\t' -v name="${PRODUCT}-latest-macos-arm64" '$2 == name && $3 == "false" { print $1 }' <<< "$artifacts")"
          windows_id="$(awk -F '\t' -v name="${PRODUCT}-latest-windows-x64" '$2 == name && $3 == "false" { print $1 }' <<< "$artifacts")"
          [[ "$mac_id" =~ ^[0-9]+$ ]]
          [[ "$windows_id" =~ ^[0-9]+$ ]]
          printf 'mac_id=%s\nwindows_id=%s\n' "$mac_id" "$windows_id" >> "$GITHUB_OUTPUT"

      - name: Download exact artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAC_ID: ${{ steps.artifacts.outputs.mac_id }}
          WINDOWS_ID: ${{ steps.artifacts.outputs.windows_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/macos artifacts/windows
          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GH_REPO/actions/artifacts/$MAC_ID/zip" > artifacts/macos.zip
          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GH_REPO/actions/artifacts/$WINDOWS_ID/zip" > artifacts/windows.zip
          unzip -q artifacts/macos.zip -d artifacts/macos
          unzip -q artifacts/windows.zip -d artifacts/windows

      - name: Verify checksums and prepare versioned ZIPs
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          PRODUCT: ${{ inputs.product_name }}
        run: |
          set -euo pipefail
          verify_payload() {
            local directory="$1"
            local expected_zip="$2"
            local manifest="$directory/SHA256SUMS.txt"
            [[ -f "$directory/$expected_zip" ]]
            [[ -f "$manifest" ]]
            [[ "$(wc -l < "$manifest" | tr -d ' ')" == 1 ]]
            local line
            line="$(cat "$manifest")"
            [[ "$line" =~ ^[0-9a-f]{64}\ \ [A-Za-z0-9._-]+$ ]]
            [[ "${line#*  }" == "$expected_zip" ]]
            (cd "$directory" && sha256sum --check --strict SHA256SUMS.txt)
          }

          verify_payload artifacts/macos "${PRODUCT}-latest-macos-arm64.zip"
          verify_payload artifacts/windows "${PRODUCT}-latest-windows-x64.zip"
          version="${TAG_NAME#v}"
          cp "artifacts/macos/${PRODUCT}-latest-macos-arm64.zip" "${PRODUCT}-${version}-macos-arm64.zip"
          cp "artifacts/windows/${PRODUCT}-latest-windows-x64.zip" "${PRODUCT}-${version}-windows-x64.zip"
          unzip -t "${PRODUCT}-${version}-macos-arm64.zip"
          unzip -t "${PRODUCT}-${version}-windows-x64.zip"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRODUCT: ${{ inputs.product_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')"
            [[ "$is_draft" == true ]]
          else
            gh release create "$TAG_NAME" --verify-tag --draft \
              --title "$PRODUCT $version" --generate-notes
          fi
          while IFS= read -r existing_asset; do
            [[ -z "$existing_asset" ]] || gh release delete-asset "$TAG_NAME" "$existing_asset" --yes
          done < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          gh release upload "$TAG_NAME" \
            "${PRODUCT}-${version}-macos-arm64.zip" \
            "${PRODUCT}-${version}-windows-x64.zip" --clobber
          mapfile -t published_assets < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          [[ "${#published_assets[@]}" == 2 ]]
          [[ "${published_assets[0]}" == "${PRODUCT}-${version}-macos-arm64.zip" ]]
          [[ "${published_assets[1]}" == "${PRODUCT}-${version}-windows-x64.zip" ]]
          gh release edit "$TAG_NAME" --draft=false
