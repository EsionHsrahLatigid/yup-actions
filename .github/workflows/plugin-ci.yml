name: Reusable YUP plugin CI

on:
  workflow_call:
    inputs:
      product_name:
        description: Human-readable product name used in artifact filenames
        required: true
        type: string
      product_slug:
        description: Lowercase target and bundle prefix
        required: true
        type: string
      cmake_option_prefix:
        description: Uppercase CMake option prefix
        required: true
        type: string
      debug_targets_json:
        description: JSON array of targets built by the Debug jobs
        required: false
        default: "[]"
        type: string
      release_test_targets_json:
        description: JSON array of test-only targets built beside ehl_stage_products
        required: false
        default: "[]"
        type: string
      windows_debug_plugins:
        description: Build plugin formats in the Windows Debug job
        required: false
        default: false
        type: boolean
      force_heavy:
        description: Force or skip heavy jobs for workflow_dispatch
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.classify.outputs.run_heavy }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          FORCE_HEAVY: ${{ inputs.force_heavy }}
        run: |
          set -euo pipefail
          run_heavy=true
          reason=conservative-fallback

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$FORCE_HEAVY" == true ]]; then
              reason=manual-force
            else
              run_heavy=false
              reason=manual-skip
            fi
          else
            base_sha=
            if [[ "$EVENT_NAME" == pull_request ]]; then
              if ! git show-ref --verify --quiet "refs/remotes/origin/$BASE_REF"; then
                git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
              fi
              base_sha="$(git merge-base "origin/$BASE_REF" HEAD)"
              reason=pull-request-diff
            elif [[ "$EVENT_NAME" == push ]] \
              && [[ -n "$BEFORE_SHA" ]] \
              && [[ ! "$BEFORE_SHA" =~ ^0+$ ]] \
              && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA"; then
              base_sha="$BEFORE_SHA"
              reason=push-diff
            else
              reason=initial-or-force-push
            fi

            if [[ -n "$base_sha" ]]; then
              run_heavy=false
              while IFS= read -r -d '' changed_path; do
                case "$changed_path" in
                  README.md|DESIGN.md|LICENSE|docs/*|.github/ISSUE_TEMPLATE/*)
                    ;;
                  *)
                    run_heavy=true
                    reason=build-impacting-change
                    break
                    ;;
                esac
              done < <(git diff --name-only -z "$base_sha" "$AFTER_SHA")
              if [[ "$run_heavy" == false ]]; then
                reason=docs-only
              fi
            fi
          fi

          {
            printf 'run_heavy=%s\n' "$run_heavy"
            printf 'reason=%s\n' "$reason"
          } >> "$GITHUB_OUTPUT"
          printf 'run_heavy=%s (%s)\n' "$run_heavy" "$reason"

  macos-arm64:
    name: macOS arm64
    needs: classify
    if: needs.classify.outputs.run_heavy == 'true'
    runs-on: macos-26
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Configure Debug tests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            cmake --preset engine-debug \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DCMAKE_OBJC_COMPILER_LAUNCHER=sccache \
              -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache && break
            if [[ $attempt -eq 3 ]]; then exit 1; fi
            echo "::warning::Dependency fetch failed; retrying configure ($attempt/3)"
            sleep $((attempt * 5))
          done

      - name: Build Debug tests
        run: cmake --build --preset engine-debug --parallel

      - name: Run Debug tests
        run: ctest --preset engine-debug --output-on-failure

      - name: Configure Release bundles
        shell: bash
        run: |
          for attempt in 1 2 3; do
            cmake --preset plugin-release \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DCMAKE_OBJC_COMPILER_LAUNCHER=sccache \
              -DCMAKE_OBJCXX_COMPILER_LAUNCHER=sccache && break
            if [[ $attempt -eq 3 ]]; then exit 1; fi
            echo "::warning::Dependency fetch failed; retrying configure ($attempt/3)"
            sleep $((attempt * 5))
          done

      - name: Build and stage Release bundles
        shell: bash
        env:
          EXTRA_TARGETS_JSON: ${{ inputs.release_test_targets_json }}
        run: |
          set -euo pipefail
          extra_targets=()
          while IFS= read -r target; do
            extra_targets+=("$target")
          done < <(jq -r '.[]' <<< "$EXTRA_TARGETS_JSON")
          cmake --build build/plugin-release --config Release --parallel \
            --target ehl_stage_products "${extra_targets[@]}"

      - name: Run Release tests
        run: ctest --preset plugin-release --output-on-failure

      - name: Verify staged macOS bundles
        shell: bash
        env:
          SLUG: ${{ inputs.product_slug }}
        run: |
          set -euo pipefail
          stage=artifacts/plugin-release/macos-arm64
          test -d "$stage/standalone/${SLUG}_standalone_plugin.app"
          test -d "$stage/vst3/${SLUG}_vst3_plugin.vst3"
          test -d "$stage/au/${SLUG}_au_plugin.component"
          test -f "$stage/ARTIFACTS.txt"
          codesign --verify --deep --strict "$stage/standalone/${SLUG}_standalone_plugin.app"
          codesign --verify --deep --strict "$stage/vst3/${SLUG}_vst3_plugin.vst3"
          codesign --verify --deep --strict "$stage/au/${SLUG}_au_plugin.component"

      - name: Package macOS bundles
        shell: bash
        env:
          PRODUCT: ${{ inputs.product_name }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/${PRODUCT}-macos-arm64"
          ditto artifacts/plugin-release/macos-arm64 "dist/${PRODUCT}-macos-arm64"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/${PRODUCT}-macos-arm64" "dist/${PRODUCT}-latest-macos-arm64.zip"
          (
            cd dist
            shasum -a 256 "${PRODUCT}-latest-macos-arm64.zip" \
              | awk '{ print tolower($1) "  " $2 }' > SHA256SUMS.txt
          )

      - name: Upload macOS latest ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.product_name }}-latest-macos-arm64
          path: |
            dist/${{ inputs.product_name }}-latest-macos-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    name: Windows x64
    needs: classify
    if: needs.classify.outputs.run_heavy == 'true'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure Debug tests
        shell: pwsh
        env:
          PREFIX: ${{ inputs.cmake_option_prefix }}
          BUILD_PLUGINS: ${{ inputs.windows_debug_plugins }}
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build/windows-debug `
            -G "Visual Studio 18 2026" -A x64 `
            "-D${env:PREFIX}_BUILD_PLUGIN=$($env:BUILD_PLUGINS.ToUpperInvariant())" `
            "-D${env:PREFIX}_BUILD_TESTS=ON"

      - name: Build Debug tests
        shell: pwsh
        env:
          TARGETS_JSON: ${{ inputs.debug_targets_json }}
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @($env:TARGETS_JSON | ConvertFrom-Json)
          if ($targets.Count -eq 0) { throw "debug_targets_json must contain at least one target" }
          $arguments = @("--build", "build/windows-debug", "--config", "Debug", "--parallel", "--target") + $targets
          & cmake @arguments

      - name: Run Debug tests
        shell: pwsh
        run: ctest --test-dir build/windows-debug -C Debug --output-on-failure

      - name: Configure Release bundles
        shell: pwsh
        env:
          PREFIX: ${{ inputs.cmake_option_prefix }}
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build/windows-release `
            -G "Visual Studio 18 2026" -A x64 `
            "-D${env:PREFIX}_BUILD_PLUGIN=ON" `
            "-D${env:PREFIX}_BUILD_TESTS=ON"

      - name: Build and stage Release bundles
        shell: pwsh
        env:
          EXTRA_TARGETS_JSON: ${{ inputs.release_test_targets_json }}
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @("ehl_stage_products") + @($env:EXTRA_TARGETS_JSON | ConvertFrom-Json)
          $arguments = @("--build", "build/windows-release", "--config", "Release", "--parallel", "--target") + $targets
          & cmake @arguments

      - name: Run Release tests
        shell: pwsh
        run: ctest --test-dir build/windows-release -C Release --output-on-failure

      - name: Package staged Windows bundles
        shell: pwsh
        env:
          PRODUCT: ${{ inputs.product_name }}
          SLUG: ${{ inputs.product_slug }}
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "artifacts/plugin-release/windows-x64"
          if (-not (Test-Path "$stage/standalone/${env:SLUG}_standalone_plugin.exe" -PathType Leaf)) {
            throw "Missing staged standalone executable"
          }
          if (-not (Test-Path "$stage/vst3/${env:SLUG}_vst3_plugin.vst3" -PathType Container)) {
            throw "Missing staged VST3 bundle"
          }
          if (-not (Test-Path "$stage/ARTIFACTS.txt" -PathType Leaf)) {
            throw "Missing artifact manifest"
          }
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "dist/${env:PRODUCT}-windows-x64" | Out-Null
          Copy-Item "$stage/*" "dist/${env:PRODUCT}-windows-x64/" -Recurse
          Compress-Archive -Path "dist/${env:PRODUCT}-windows-x64" `
            -DestinationPath "dist/${env:PRODUCT}-latest-windows-x64.zip" -Force
          $hash = (Get-FileHash "dist/${env:PRODUCT}-latest-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Join-Path (Resolve-Path dist) "SHA256SUMS.txt"
          [IO.File]::WriteAllText(
            $manifest,
            "$hash  ${env:PRODUCT}-latest-windows-x64.zip`n",
            [Text.UTF8Encoding]::new($false))

      - name: Upload Windows latest ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.product_name }}-latest-windows-x64
          path: |
            dist/${{ inputs.product_name }}-latest-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  summary:
    name: CI Summary
    if: always()
    needs:
      - classify
      - macos-arm64
      - windows-x64
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RUN_HEAVY: ${{ needs.classify.outputs.run_heavy }}
          CLASSIFY_REASON: ${{ needs.classify.outputs.reason }}
          MACOS_RESULT: ${{ needs.macos-arm64.result }}
          WINDOWS_RESULT: ${{ needs.windows-x64.result }}
        run: |
          set -euo pipefail
          printf 'classifier=%s run_heavy=%s reason=%s macos=%s windows=%s\n' \
            "$CLASSIFY_RESULT" "$RUN_HEAVY" "$CLASSIFY_REASON" "$MACOS_RESULT" "$WINDOWS_RESULT"
          [[ "$CLASSIFY_RESULT" == success ]]
          if [[ "$RUN_HEAVY" == true ]]; then
            [[ "$MACOS_RESULT" == success ]]
            [[ "$WINDOWS_RESULT" == success ]]
          else
            [[ "$RUN_HEAVY" == false ]]
            [[ "$MACOS_RESULT" == skipped ]]
            [[ "$WINDOWS_RESULT" == skipped ]]
          fi
